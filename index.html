<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Study Room - Stay Focused!</title>
    <link rel="stylesheet" href="style.css">
    <!-- Carichiamo le librerie ufficiali di MediaPipe per il tracciamento del volto -->
    <!-- <script src="https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script> -->
    <!-- Sostituisci la vecchia riga di jsdelivr con questa di unpkg -->
<script src="https://unpkg.com/@mediapipe/tasks-vision@0.10.3/vision_bundle.js" crossorigin="anonymous"></script>
</head>
<body>

    <div class="container">
        <h1>Amos Study Room 📚</h1>
        <p class="subtitle">Entra in modalità focus. Se distogli lo sguardo, verrai ripresa!</p>

        <div class="status-card" id="statusCard">
            <span id="statusText">Sistema non avviato</span>
        </div>

        <div class="video-container">
            <!-- La webcam viene proiettata qui -->
            <video id="webcam" autoplay playsinline></video>
            <div class="overlay-grid"></div>
        </div>

        <button id="startButton">Avvia Sessione Studio</button>
    </div>

    <audio id="alarmAudio" src="sveglia.mp3" loop></audio>

    <script src="app.js" type="module"></script>
</body>
</html>
